<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA | Graphic Design Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo-container">
            <span class="nav-brand">NEXA STUDIO</span>
        </div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#services">Offers</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <header id="home" class="hero">
        <a href="#services" class="gold-cta-btn">View Offers</a>
    </header>

    <section id="services">
        <h2 class="section-title">Our Expertise</h2>
        <div class="services-grid">
            <div class="service-card" onclick="openModal('logo')"><i class="fas fa-pen-nib"></i><h3>Logo Design</h3></div>
            <div class="service-card" onclick="openModal('poster')"><i class="fas fa-layer-group"></i><h3>Poster Design</h3></div>
            <div class="service-card" onclick="openModal('card')"><i class="fas fa-address-card"></i><h3>Business Cards</h3></div>
            <div class="service-card" onclick="openModal('invitation')"><i class="fas fa-envelope-open-text"></i><h3>Invitations</h3></div>
            <div class="service-card" onclick="openModal('photo')"><i class="fas fa-camera"></i><h3>Photography</h3></div>
            <div class="service-card" onclick="openModal('video')"><i class="fas fa-video"></i><h3>Video Editing</h3></div>
            <div class="service-card" onclick="openModal('web')"><i class="fas fa-code"></i><h3>Web Design</h3></div>
            <div class="service-card" onclick="openModal('presentation')"><i class="fas fa-chalkboard-teacher"></i><h3>Presentations</h3></div>
            <div class="service-card" onclick="openModal('social')"><i class="fas fa-hashtag"></i><h3>Social Media Management</h3></div>
        </div>
    </section>

    <div id="portfolioModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="modalGallery" class="modal-gallery"></div>
            <p id="modalPrice" class="price-tag"></p>
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="this.style.display='none'">
        <img id="lightboxImg" src="" alt="Zoom">
    </div>

    <section id="contact">
        <div class="contact-info">
            <p><i class="fas fa-phone"></i> +387 65 959 096</p>
            <p><a href="mailto:nexa.info2@gmail.com"><i class="fas fa-envelope"></i> nexa.info2@gmail.com</a></p>
            <p><a href="https://instagram.com/nexa_studio2" target="_blank"><i class="fab fa-instagram"></i> @nexa_studio2</a></p>
        </div>
    </section>

    <a href="https://wa.me/38765959096" class="whatsapp-btn" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script src="script.js"></script>
</body>
</html>
